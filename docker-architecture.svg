<svg width="680" height="210" viewBox="0 0 680 210" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="210" fill="#ffffff"/>

  <!-- Outer cluster -->
  <rect x="40" y="40" width="600" height="150" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">One cluster — Auto Mode ON</text>
  <text x="340" y="82" text-anchor="middle" font-size="12" fill="#0F6E56">no exclusion needed, no second cluster</text>

  <!-- Hub services -->
  <rect x="70" y="100" width="260" height="70" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="200" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Hub services</text>
  <text x="200" y="152" text-anchor="middle" font-size="12" fill="#5F5E5A">BE, AI, FE, sandbox-service</text>

  <!-- Sandbox pods -->
  <rect x="370" y="100" width="260" height="70" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="500" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Sandbox pods (Docker/runc)</text>
  <text x="500" y="152" text-anchor="middle" font-size="12" fill="#993C1D">same nodes, same cluster</text>
</svg>
