<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="230" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Hub cluster -->
  <rect x="200" y="40" width="280" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Hub cluster — Auto Mode ON</text>
  <text x="340" y="82" text-anchor="middle" font-size="12" fill="#0F6E56">backend, AI, FE services</text>

  <!-- Arrow -->
  <line x1="340" y1="96" x2="340" y2="140" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="118" text-anchor="start" font-size="12" fill="#5F5E5A">Transit Gateway</text>

  <!-- Sandbox cluster -->
  <rect x="160" y="140" width="360" height="70" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Sandbox cluster — dedicated</text>
  <text x="340" y="187" text-anchor="middle" font-size="12" fill="#993C1D">100% gVisor, Auto Mode off entirely</text>
</svg>
