<svg width="680" height="388" viewBox="0 0 680 388" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="388" fill="#ffffff"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="40" y="40" width="600" height="328" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">gVisor — one Sentry per project</text>

  <!-- Projects -->
  <rect x="70" y="86" width="160" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="150" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Project A</text>
  <text x="150" y="128" text-anchor="middle" font-size="12" fill="#993C1D">gVisor sandbox</text>

  <rect x="260" y="86" width="160" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Project B</text>
  <text x="340" y="128" text-anchor="middle" font-size="12" fill="#993C1D">gVisor sandbox</text>

  <rect x="450" y="86" width="160" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="530" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Project C</text>
  <text x="530" y="128" text-anchor="middle" font-size="12" fill="#993C1D">gVisor sandbox</text>

  <!-- Straight arrows down to Sentries -->
  <line x1="150" y1="142" x2="150" y2="182" stroke="#444441" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="340" y1="142" x2="340" y2="182" stroke="#444441" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="530" y1="142" x2="530" y2="182" stroke="#444441" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Sentries -->
  <rect x="70" y="182" width="160" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="150" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Sentry</text>
  <text x="150" y="224" text-anchor="middle" font-size="12" fill="#0F6E56">userspace kernel</text>

  <rect x="260" y="182" width="160" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Sentry</text>
  <text x="340" y="224" text-anchor="middle" font-size="12" fill="#0F6E56">userspace kernel</text>

  <rect x="450" y="182" width="160" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="530" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Sentry</text>
  <text x="530" y="224" text-anchor="middle" font-size="12" fill="#0F6E56">userspace kernel</text>

  <!-- Converging arrows to kernel -->
  <line x1="150" y1="238" x2="250" y2="284" stroke="#444441" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="340" y1="238" x2="340" y2="284" stroke="#444441" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="530" y1="238" x2="430" y2="284" stroke="#444441" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Host kernel, shielded -->
  <rect x="190" y="288" width="300" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Host kernel — shielded</text>
  <text x="340" y="330" text-anchor="middle" font-size="12" fill="#5F5E5A">only filtered syscalls arrive</text>
</svg>
